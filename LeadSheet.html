<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom sheet xin thông tin liên hệ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 390px; max-width: 100%; height: 844px; margin: 0 auto; position: relative; background: #F3F4F7; font-family: 'Be Vietnam Pro', sans-serif; color: #111827; overflow: hidden">
  <div aria-hidden="true" style="display: flex; flex-direction: column">
    <div style="height: 56px; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 600">Chấm writing</div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="background: #C2410C; border-radius: 20px; padding: 18px 20px; color: #FFFFFF; display: flex; gap: 18px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #FFFFFF">Band ước tính</span><span style="font-size: 48px; line-height: 1; font-weight: 700">5.5</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #FFFFFF">Hoà hợp chủ–vị</span><span style="font-size: 18px; font-weight: 700">3 lỗi cần sửa</span></div>
      </div>
      <div style="height: 136px; background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px"></div>
      <div style="height: 200px; background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px"></div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(17,24,39,0.55)"></div>

  <div role="dialog" aria-labelledby="sheetTitle" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -8px 32px rgba(17,24,39,0.18)">
    <div id="mascotSmall" style="position: absolute; left: 18px; top: -64px; width: 76px"></div>
    <div style="width: 40px; height: 4px; border-radius: 4px; background: #D7DCE5; align-self: center"></div>
    <a href="M2Result.html" aria-label="Đóng" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 999px; background: #F3F4F7; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>

    <div style="display: flex; flex-direction: column; gap: 12px; padding-right: 48px">
      <div style="width: 48px; height: 48px; border-radius: 14px; background: #FFEDD5; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12h18"></path><path d="M12 8c-1.5-3-5-3.5-5-1.2C7 8 9 8 12 8zM12 8c1.5-3 5-3.5 5-1.2C17 8 15 8 12 8z"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 id="sheetTitle" style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700">Nhận full báo cáo và tài liệu nâng band</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">Miễn phí, gửi qua Zalo hoặc email.</p>
      </div>
    </div>

    <div style="background: #FFF7ED; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5L20 7"></path></svg>Bản viết lại cả bài + chấm đủ 8 khía cạnh</div>
      <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5L20 7"></path></svg>Bộ tài liệu nâng band của thầy Phúc</div>
      <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5L20 7"></path></svg>Thông tin khoá [TÊN KHOÁ HỌC] và ưu đãi</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="contact" style="font-size: 13px; font-weight: 600; color: #4B5563">Số điện thoại (Zalo) hoặc email</label>
      <input id="contact" type="text" inputmode="email" placeholder="VD: 0912 345 678" style="height: 52px; border: 1.5px solid #C2410C; border-radius: 12px; box-shadow: 0 0 0 4px #FFEDD5; padding: 0 14px; font-family: inherit; font-size: 16px; box-sizing: border-box; outline: none">
    </div>
    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; color: #4B5563">
      <input type="checkbox" checked="checked" style="width: 18px; height: 18px; accent-color: #C2410C; margin: 1px 0 0; flex-shrink: 0">
      Tôi đồng ý nhận tư vấn về khoá học. Không spam, huỷ bất cứ lúc nào.
    </label>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a href="ThankYou.html" style="height: 52px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Gửi cho tôi</a>
      <a href="M2Result.html" style="height: 44px; color: #4B5563; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Để sau</a>
    </div>
  </div>
</div>
<script src="mascot.js"></script>
<script>
renderMascot(document.getElementById('mascotSmall'), { mood: 'happy', bubble: false, size: 76 });
</script>
</body>
</html>
