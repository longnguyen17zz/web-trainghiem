<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phương pháp 1 — sắp xếp câu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 390px; max-width: 100%; height: 844px; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: #F3F4F7; font-family: 'Be Vietnam Pro', sans-serif; color: #111827; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px; background: #FFFFFF">
    <a href="M1Sentence.html" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; font-size: 16px; font-weight: 600">Ghép câu từ vựng</div>
    <span style="font-size: 12px; font-weight: 600; color: #C2410C; background: #FFEDD5; border-radius: 999px; padding: 6px 10px">Còn 2 lượt AI</span>
  </header>
  <div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #DDE1E8; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: #4B5563"><span>Bước 3/3</span><span>Sắp xếp câu · Câu 1/3</span></div>
  </div>

  <main style="flex: 1; overflow-y: auto; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 104px">
    <div style="background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 600; color: #C2410C; background: #FFEDD5; border-radius: 999px; padding: 4px 10px">Câu gốc</span>
        <button aria-label="Nghe câu" style="height: 30px; border: 0; border-radius: 999px; background: #FFEDD5; color: #C2410C; font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 0 12px; display: flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="#C2410C"><path d="M7 5v14l11-7z"></path></svg>Nghe</button>
      </div>
      <div style="font-size: 16px; line-height: 1.55">Deforestation destroys the natural <span style="color: #C8102E; font-weight: 700">habitat</span> of many animals, so we must <span style="color: #C8102E; font-weight: 700">conserve</span> forests.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 15px; font-weight: 700">Xếp lại bản dịch tiếng Việt cho đúng</div>
      <div style="font-size: 12.5px; color: #4B5563">Đọc kỹ câu gốc bên trên, chạm từng cụm bên dưới theo đúng thứ tự.</div>
    </div>

    <div id="slots" style="background: #FFFFFF; border: 1.5px solid #DDE1E8; border-radius: 14px; padding: 12px; margin-right: 50px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 92px; align-content: flex-start"></div>

    <div id="feedback"></div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 600; color: #4B5563">Chạm để thêm vào câu:</div>
      <div id="pool" style="display: flex; flex-wrap: wrap; gap: 8px; padding-right: 50px"></div>
    </div>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DDE1E8; padding: 12px 16px 20px">
    <a href="M1Practice.html" style="height: 52px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Tiếp tục</a>
  </footer>
  <div id="mascot" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 310px; z-index: 10"></div>
</div>
<script src="mascot.js"></script>
<script>
var CHUNKS = {
  c1: 'Nạn phá rừng', c2: 'huỷ hoại', c3: 'môi trường sống tự nhiên',
  c4: 'của nhiều loài,', c5: 'vì vậy', c6: 'chúng ta phải bảo tồn rừng.'
};
var ORDER = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'];
var POOL_ORDER = ['c5', 'c3', 'c6', 'c4'];
var placed = ['c1', 'c2'];

var slotBase = 'min-height: 38px; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; padding: 7px 12px; display: flex; align-items: center; border: 0; cursor: pointer;';
var poolBase = 'min-height: 44px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 14px; border: 1.5px solid #DDE1E8; background: #FFFFFF; color: #111827; cursor: pointer;';

function render() {
  var slotsEl = document.getElementById('slots');
  var poolEl = document.getElementById('pool');
  var feedbackEl = document.getElementById('feedback');
  var placedSet = {};
  placed.forEach(function (id) { placedSet[id] = true; });

  slotsEl.innerHTML = '';
  placed.forEach(function (id, i) {
    var correct = ORDER[i] === id;
    var btn = document.createElement('button');
    btn.style.cssText = slotBase + (correct
      ? 'border: 1.5px solid #B9E2C8; background: #E6F4EC; color: #0E6B42;'
      : 'border: 1.5px solid #F3B9BE; background: #FDECEE; color: #A30D25;');
    btn.textContent = CHUNKS[id];
    btn.onclick = function () { placed = placed.slice(0, i); render(); };
    slotsEl.appendChild(btn);
  });
  var remaining = ORDER.length - placed.length;
  for (var i = 0; i < remaining; i++) {
    var span = document.createElement('span');
    span.style.cssText = slotBase + 'border: 1.5px dashed #DDE1E8; background: #F8F9FB; color: #B8BFCC;';
    span.textContent = '···';
    slotsEl.appendChild(span);
  }

  poolEl.innerHTML = '';
  POOL_ORDER.filter(function (id) { return !placedSet[id]; }).forEach(function (id) {
    var btn = document.createElement('button');
    btn.style.cssText = poolBase;
    btn.textContent = CHUNKS[id];
    btn.onclick = function () {
      if (placed.length < ORDER.length) { placed = placed.concat([id]); render(); }
    };
    poolEl.appendChild(btn);
  });

  var allPlaced = placed.length === ORDER.length;
  var allCorrect = allPlaced && placed.every(function (id, i) { return ORDER[i] === id; });
  var hasMistake = placed.some(function (id, i) { return ORDER[i] !== id; });

  if (allPlaced || hasMistake) {
    var style = allCorrect
      ? 'background: #E6F4EC; color: #0E6B42; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600;'
      : 'background: #FDECEE; color: #A30D25; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600;';
    feedbackEl.innerHTML = '<div style="' + style + '">' + (allCorrect
      ? 'Chính xác! Đúng thứ tự câu dịch rồi.'
      : 'Có cụm xếp sai thứ tự — chạm vào cụm màu đỏ để bỏ ra rồi xếp lại.') + '</div>';
  } else {
    feedbackEl.innerHTML = '';
  }

  renderMascot(document.getElementById('mascot'), {
    mood: allCorrect ? 'cheer' : (hasMistake ? 'sad' : 'idle'),
    message: allCorrect ? 'Chuẩn luôn! Bạn ghép đúng cả câu dịch.' : (hasMistake ? 'Có cụm chưa đúng chỗ, xem lại câu gốc nhé.' : 'Chạm cụm tiếp theo bạn nghĩ là đúng thứ tự.')
  });
}
render();
</script>
</body>
</html>
