<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phương pháp 1 — luyện nghĩa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 390px; max-width: 100%; height: 844px; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: #F3F4F7; font-family: 'Be Vietnam Pro', sans-serif; color: #111827; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px; background: #FFFFFF">
    <a href="M1Arrange.html" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; font-size: 16px; font-weight: 600">Ghép câu từ vựng</div>
    <span style="font-size: 12px; font-weight: 600; color: #C2410C; background: #FFEDD5; border-radius: 999px; padding: 6px 10px">Còn 2 lượt AI</span>
  </header>
  <div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #DDE1E8; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: #4B5563"><span>Bước 3/3</span><span>Luyện nghĩa · Chạm để nối từ</span></div>
  </div>

  <main style="flex: 1; overflow-y: auto; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 60px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 15px; font-weight: 700">Chạm từ tiếng Anh rồi chạm đúng nghĩa tiếng Việt</div>
      <div style="font-size: 12.5px; color: #4B5563">Chạm 1 thẻ bên trái, sau đó chạm thẻ nghĩa đúng bên phải để nối.</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex: 1; height: 6px; border-radius: 6px; background: #EEF0F4; overflow: hidden"><div id="bar" style="height: 6px; background: #0E6B42; width: 33%"></div></div>
      <span id="pct" style="font-size: 12px; font-weight: 600; color: #0E6B42; flex-shrink: 0">Đã nối 2/6</span>
    </div>

    <div style="position: relative; height: 396px">
      <svg id="lines" width="358" height="396" style="position: absolute; left: 0; top: 0; pointer-events: none"></svg>
      <div id="leftCards" style="position: absolute; left: 0; top: 0; width: 150px"></div>
      <div id="rightCards" style="position: absolute; right: 0; top: 0; width: 150px"></div>
    </div>

    <div id="feedback"></div>
  </main>

  <div id="mascot" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 310px; z-index: 5"></div>

  <div id="celebration" style="display: none; position: absolute; inset: 0; background: rgba(17,24,39,0.5); backdrop-filter: blur(2px); z-index: 20; align-items: center; justify-content: center; animation: backdropIn .22s ease">
    <div id="confetti" style="position: absolute; left: 50%; top: 32%; width: 0; height: 0; pointer-events: none"></div>
    <div style="position: relative; width: 320px; max-height: 720px; overflow-y: auto; background: #FFFFFF; border-radius: 20px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); animation: popupIn .32s cubic-bezier(.2,.9,.3,1.2)">
      <button onclick="closeCelebration()" aria-label="Đóng" style="position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; border: 0; background: #F3F4F7; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding-top: 4px">
        <div style="width: 56px; height: 56px; border-radius: 999px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; font-size: 28px">🎉</div>
        <h2 id="resultTitle" style="margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700"></h2>
        <p id="resultNote" style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #4B5563"></p>
      </div>
      <div style="background: #F8F9FB; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: center; gap: 8px">
        <span style="font-size: 12.5px; font-weight: 600; color: #4B5563">Từ vựng đã luyện</span>
        <span id="scoreLine" style="font-size: 14px; font-weight: 800"></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 700; text-align: center">Bạn thấy phương pháp này thế nào?</div>
        <div id="moods" style="display: flex; justify-content: space-between; gap: 6px"></div>
        <div id="moodNote" style="font-size: 12px; color: #0E6B42; font-weight: 600; text-align: center"></div>
      </div>
      <a href="LeadSheet.html" style="height: 48px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Gửi đánh giá & nhận tài liệu</a>
      <div style="display: flex; justify-content: center; gap: 18px">
        <button onclick="restart()" style="border: 0; background: transparent; padding: 0; font-size: 12.5px; font-weight: 600; color: #4B5563">Làm lại</button>
        <a href="index.html" style="font-size: 12.5px; font-weight: 600; color: #4B5563; text-decoration: none">Về trang chủ</a>
      </div>
    </div>
  </div>
</div>
<script src="mascot.js"></script>
<script>
var PAIRS = [
  { id: 'habitat', en: 'habitat', vi: 'môi trường sống' },
  { id: 'deforestation', en: 'deforestation', vi: 'nạn phá rừng' },
  { id: 'extinction', en: 'extinction', vi: 'sự tuyệt chủng' },
  { id: 'conservation', en: 'conservation', vi: 'bảo tồn' },
  { id: 'pollution', en: 'pollution', vi: 'ô nhiễm' },
  { id: 'ecosystem', en: 'ecosystem', vi: 'hệ sinh thái' }
];
var RIGHT_ORDER = ['pollution', 'habitat', 'conservation', 'deforestation', 'ecosystem', 'extinction'];
var STEP = 68;
var byId = {}; PAIRS.forEach(function (p) { byId[p.id] = p; });
var leftIndex = {}; PAIRS.forEach(function (p, i) { leftIndex[p.id] = i; });
var rightIndex = {}; RIGHT_ORDER.forEach(function (id, i) { rightIndex[id] = i; });

var connections = { habitat: 'habitat', deforestation: 'deforestation' };
var selected = null;

var baseLeft = 'position: absolute; left: 0; width: 150px; height: 52px; border-radius: 12px; font-family: inherit; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 0 10px; text-align: left; border: 0; cursor: pointer;';
var baseRight = 'position: absolute; right: 0; width: 150px; height: 52px; border-radius: 12px; font-family: inherit; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; padding: 0 12px; text-align: left; border: 0; cursor: pointer;';
var neutralStyle = 'border: 1.5px solid #BFD8F2; background: #EDF4FC; color: #1D4E89;';
var correctStyle = 'border: 1.5px solid #B9E2C8; background: #E6F4EC; color: #0E6B42;';
var wrongStyle = 'border: 1.5px solid #F3B4BD; background: #FDECEE; color: #A30D25;';
var defaultStyle = 'border: 1.5px solid #DDE1E8; background: #FFFFFF; color: #111827;';
var selectedStyle = 'border: 2px solid #C2410C; background: #FFFFFF; color: #111827; box-shadow: 0 10px 18px rgba(194,65,12,0.28); z-index: 3;';

var MOOD_DEFS = [
  { id: 'bad', emoji: '😕', note: 'Cảm ơn góp ý, mình sẽ cải thiện thêm.' },
  { id: 'meh', emoji: '😐', note: 'Cảm ơn bạn đã thử phương pháp này.' },
  { id: 'good', emoji: '🙂', note: 'Vui vì bạn thấy ổn! Để lại info nhận thêm tài liệu nhé.' },
  { id: 'great', emoji: '😄', note: 'Tuyệt! Để lại thông tin để nhận tư vấn lộ trình nhé.' },
  { id: 'love', emoji: '🤩', note: 'Mê quá! Để lại thông tin để học tiếp cùng thầy Phúc nhé.' }
];
var picked = 'good';

function pickLeft(id) { if (!isAllDone()) { selected = id; render(); } }
function pickRight(id) {
  if (isAllDone() || !selected) return;
  var next = {};
  Object.keys(connections).forEach(function (k) { if (connections[k] !== id) next[k] = connections[k]; });
  next[selected] = id;
  connections = next; selected = null;
  render();
  if (Object.keys(next).length === PAIRS.length) {
    setTimeout(function () { document.getElementById('celebration').style.display = 'flex'; renderCelebration(); spawnConfetti(); }, 350);
  }
}
function closeCelebration() { document.getElementById('celebration').style.display = 'none'; }
function restart() { connections = {}; selected = null; closeCelebration(); render(); }

var CONFETTI_COLORS = ['#C2410C', '#0E6B42', '#4338CA', '#8A4006', '#C8102E', '#1D4E89'];
function spawnConfetti() {
  var el = document.getElementById('confetti');
  el.innerHTML = '';
  var count = 18;
  for (var i = 0; i < count; i++) {
    var angle = (i * (360 / count)) * (Math.PI / 180);
    var distance = 72 + (i % 3) * 22;
    var tx = Math.round(Math.cos(angle) * distance);
    var ty = Math.round(Math.sin(angle) * distance);
    var size = 6 + (i % 3) * 2;
    var color = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    var delay = (i % 6) * 0.03;
    var span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:0;top:0;border-radius:2px;--tx:' + tx + 'px;--ty:' + ty + 'px;width:' + size + 'px;height:' + size + 'px;background:' + color + ';animation:confettiPop 1.1s ease-out forwards;animation-delay:' + delay + 's;';
    el.appendChild(span);
  }
}
function pickMood(id) { picked = id; renderCelebration(); }
function isAllDone() { return Object.keys(connections).length === PAIRS.length; }

function render() {
  var connectedCount = Object.keys(connections).length;
  var allDone = isAllDone();
  var correctCount = Object.keys(connections).filter(function (k) { return connections[k] === k; }).length;
  var perfect = correctCount === PAIRS.length;

  document.getElementById('bar').style.width = Math.round((connectedCount / PAIRS.length) * 100) + '%';
  document.getElementById('pct').textContent = 'Đã nối ' + connectedCount + '/6';

  var leftEl = document.getElementById('leftCards');
  leftEl.innerHTML = '';
  PAIRS.forEach(function (p, i) {
    var isConnected = Object.prototype.hasOwnProperty.call(connections, p.id);
    var isSelected = selected === p.id;
    var style = baseLeft + 'top:' + (i * STEP) + 'px;';
    if (allDone) style += connections[p.id] === p.id ? correctStyle : wrongStyle;
    else if (isSelected) style += selectedStyle;
    else if (isConnected) style += neutralStyle;
    else style += defaultStyle;
    var btn = document.createElement('button');
    btn.style.cssText = style;
    btn.innerHTML = '<span style="font-size:13px;letter-spacing:1px;opacity:.55">⋮⋮</span><span>' + p.en + '</span>';
    btn.onclick = function () { pickLeft(p.id); };
    leftEl.appendChild(btn);
  });

  var rightEl = document.getElementById('rightCards');
  rightEl.innerHTML = '';
  RIGHT_ORDER.forEach(function (id, i) {
    var p = byId[id];
    var connectedLeft = Object.keys(connections).find(function (k) { return connections[k] === id; });
    var isConnected = !!connectedLeft;
    var style = baseRight + 'top:' + (i * STEP) + 'px;';
    if (allDone) style += (isConnected && connectedLeft === id) ? correctStyle : (isConnected ? wrongStyle : defaultStyle);
    else if (isConnected) style += neutralStyle;
    else style += defaultStyle;
    var btn = document.createElement('button');
    btn.style.cssText = style;
    btn.textContent = p.vi;
    btn.onclick = function () { pickRight(id); };
    rightEl.appendChild(btn);
  });

  var linesSvg = document.getElementById('lines');
  linesSvg.innerHTML = '';
  Object.keys(connections).forEach(function (leftId) {
    var rightId = connections[leftId];
    var isCorrect = leftId === rightId;
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 150); line.setAttribute('y1', leftIndex[leftId] * STEP + 26);
    line.setAttribute('x2', 208); line.setAttribute('y2', rightIndex[rightId] * STEP + 26);
    line.setAttribute('stroke', allDone ? (isCorrect ? '#0E6B42' : '#C8102E') : '#9CA3AF');
    line.setAttribute('stroke-width', '2.5'); line.setAttribute('stroke-linecap', 'round');
    linesSvg.appendChild(line);
  });

  var feedbackEl = document.getElementById('feedback');
  if (allDone) {
    var style2 = perfect
      ? 'background: #E6F4EC; color: #0E6B42; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600;'
      : 'background: #FEF3E2; color: #8A4006; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600;';
    var text = perfect ? ('🎉 Chúc mừng! Bạn đã nối đúng ' + correctCount + '/6 từ.') : ('Bạn đã nối đúng ' + correctCount + '/6 từ. Các cặp màu đỏ là chưa đúng, ghi nhớ thêm nhé!');
    feedbackEl.innerHTML = '<div style="' + style2 + '">' + text + '</div>';
  } else {
    feedbackEl.innerHTML = '';
  }

  renderMascot(document.getElementById('mascot'), {
    mood: allDone ? (perfect ? 'cheer' : 'idle') : 'idle',
    message: allDone
      ? (perfect ? ('Xuất sắc! Bạn nối đúng hết ' + correctCount + '/6 rồi!') : ('Bạn nối đúng ' + correctCount + '/6 từ. Xem lại các cặp màu đỏ để nhớ kỹ hơn nhé.'))
      : 'Tự đoán nghĩa rồi chạm nối cặp nhé, không gợi ý đâu đấy!'
  });
}

function renderCelebration() {
  var correctCount = Object.keys(connections).filter(function (k) { return connections[k] === k; }).length;
  var perfect = correctCount === PAIRS.length;
  document.getElementById('resultTitle').textContent = perfect ? 'Xong rồi! Bạn đã nối đúng hết từ vựng' : 'Xong rồi! Bạn đã luyện xong phần từ vựng';
  document.getElementById('resultNote').textContent = perfect
    ? ('Nối đúng ' + correctCount + '/' + PAIRS.length + ' từ ngay lần đầu — xuất sắc! Luyện thêm vài buổi nữa là nhớ chắc hết.')
    : ('Nối đúng ' + correctCount + '/' + PAIRS.length + ' từ. Luyện lại những từ còn sai thêm vài lần để nhớ chắc hơn nhé.');
  var scoreLine = document.getElementById('scoreLine');
  scoreLine.textContent = correctCount + '/' + PAIRS.length + ' từ đúng';
  scoreLine.style.color = perfect ? '#0E6B42' : '#8A4006';

  var moodsEl = document.getElementById('moods');
  moodsEl.innerHTML = '';
  var moodBase = 'width: 44px; height: 44px; border-radius: 999px; font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 0; background: #F3F4F7; border: 2px solid transparent;';
  MOOD_DEFS.forEach(function (d) {
    var btn = document.createElement('button');
    btn.style.cssText = moodBase + (picked === d.id ? 'border-color: #C2410C; background: #FFEDD5;' : '');
    btn.textContent = d.emoji;
    btn.onclick = function () { pickMood(d.id); };
    moodsEl.appendChild(btn);
  });
  var current = MOOD_DEFS.find(function (d) { return d.id === picked; });
  document.getElementById('moodNote').textContent = current ? current.note : '';
}

render();
</script>
</body>
</html>
