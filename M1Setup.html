<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phương pháp 1 — chọn chủ đề và từ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 390px; max-width: 100%; height: 844px; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: #F3F4F7; font-family: 'Be Vietnam Pro', sans-serif; color: #111827; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 4px; background: #FFFFFF">
    <a href="index.html" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; font-size: 16px; font-weight: 600">Ghép câu từ vựng</div>
    <span style="font-size: 12px; font-weight: 600; color: #C2410C; background: #FFEDD5; border-radius: 999px; padding: 6px 10px">Còn 3 lượt AI</span>
  </header>
  <div style="flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #DDE1E8; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <div style="height: 4px; border-radius: 4px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 4px; background: #DDE1E8"></div>
      <div style="height: 4px; border-radius: 4px; background: #DDE1E8"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; color: #4B5563"><span>Bước 1/3</span><span>Chọn từ</span></div>
  </div>

  <main style="flex: 1; overflow-y: auto; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 104px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Chọn trình độ và chủ đề</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4B5563">Sau đó tick 8–10 từ bạn muốn học hôm nay.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #E7E9EE; border-radius: 12px; padding: 4px; gap: 4px">
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #4B5563">Cơ bản</button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #111827; box-shadow: 0 1px 3px rgba(17,24,39,0.12)">Trung cấp</button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #4B5563">Nâng cao</button>
    </div>

    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <button style="height: 40px; flex-shrink: 0; padding: 0 14px; border: 1.5px solid #C2410C; border-radius: 999px; background: #FFEDD5; font-family: inherit; font-size: 14px; font-weight: 600; color: #C2410C">Environment</button>
      <button style="height: 40px; flex-shrink: 0; padding: 0 14px; border: 1px solid #DDE1E8; border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111827">Education</button>
      <button style="height: 40px; flex-shrink: 0; padding: 0 14px; border: 1px solid #DDE1E8; border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111827">Technology</button>
      <button style="height: 40px; flex-shrink: 0; padding: 0 14px; border: 1px solid #DDE1E8; border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111827">Health</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; font-weight: 700">30 từ · Environment</span>
      <span style="font-size: 13px; font-weight: 600; color: #C2410C">Đã chọn 8/10</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 16px; overflow: hidden">
      <label style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px; border-bottom: 1px solid #EEF0F4; background: #FFF7ED">
        <input type="checkbox" checked="checked" style="width: 20px; height: 20px; accent-color: #C2410C; margin: 0">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">deforestation</span><span style="font-size: 13px; color: #4B5563">nạn phá rừng</span></div>
        <button aria-label="Nghe deforestation" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7"></path></svg></button>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px; border-bottom: 1px solid #EEF0F4; background: #FFF7ED">
        <input type="checkbox" checked="checked" style="width: 20px; height: 20px; accent-color: #C2410C; margin: 0">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">habitat</span><span style="font-size: 13px; color: #4B5563">môi trường sống</span></div>
        <button aria-label="Nghe habitat" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7"></path></svg></button>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px; border-bottom: 1px solid #EEF0F4">
        <input type="checkbox" style="width: 20px; height: 20px; accent-color: #C2410C; margin: 0">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">emission</span><span style="font-size: 13px; color: #4B5563">khí thải</span></div>
        <button aria-label="Nghe emission" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #F3F4F7; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7"></path></svg></button>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px; border-bottom: 1px solid #EEF0F4; background: #FFF7ED">
        <input type="checkbox" checked="checked" style="width: 20px; height: 20px; accent-color: #C2410C; margin: 0">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">conserve</span><span style="font-size: 13px; color: #4B5563">bảo tồn</span></div>
        <button aria-label="Nghe conserve" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7"></path></svg></button>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px">
        <input type="checkbox" checked="checked" style="width: 20px; height: 20px; accent-color: #C2410C; margin: 0">
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">renewable</span><span style="font-size: 13px; color: #4B5563">có thể tái tạo</span></div>
        <button aria-label="Nghe renewable" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #FFEDD5; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7"></path></svg></button>
      </label>
    </div>
    <button style="height: 44px; border: 0; background: transparent; color: #C2410C; font-family: inherit; font-size: 15px; font-weight: 600">Xem thêm 25 từ</button>
  </main>

  <footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #DDE1E8; padding: 12px 16px 20px">
    <a href="M1Sentence.html" style="height: 52px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Tiếp tục với 8 từ</a>
  </footer>
  <div id="mascot" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 310px; z-index: 5"></div>
</div>
<script src="mascot.js"></script>
<script>
renderMascot(document.getElementById('mascot'), {
  mood: 'idle',
  message: 'Tick đủ 8–10 từ nhé. Bấm loa để nghe phát âm trước.'
});
</script>
</body>
</html>
